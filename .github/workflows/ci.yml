name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python source and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        run: python -m compileall -q src nmt_pipeline.py tests
      - name: Run focused tests
        run: python -m unittest discover -s tests -v
